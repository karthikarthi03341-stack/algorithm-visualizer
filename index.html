<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AlgoViz - Algorithm Visualizer</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header>
    <div class="logo"><i>&#9646;</i>AlgoViz</div>
    <span class="tag" id="conn">Connecting to API...</span>
    <button class="btn" id="theme">Theme</button>
  </header>
  <main>
    <aside class="card"><h3>Sorting algorithms</h3><div class="algos" id="algos"></div></aside>
    <section class="card stage">
      <canvas id="cv"></canvas>
      <div id="status">Ready.</div>
      <div class="ctrl">
        <button class="btn p" id="play">Play</button>
        <button class="btn" id="step">Step</button>
        <button class="btn" id="shuf">Shuffle</button>
        <label class="sl">Size <input type="range" id="size" min="8" max="120" value="48"></label>
        <label class="sl">Speed <input type="range" id="speed" min="0" max="100" value="55"></label>
      </div>
      <div class="stats">
        <div class="stat"><b id="sc">0</b><span>Comparisons</span></div>
        <div class="stat"><b id="sw">0</b><span>Swaps / writes</span></div>
        <div class="stat"><b id="st">0</b><span>Steps</span></div>
      </div>
    </section>
    <aside class="card"><h3 id="aname">About</h3><p id="adesc"></p><table id="cx"></table></aside>
  </main>
  <script src="app.js"></script>
</body>
</html>
